# Perfil de pruebas: PostgreSQL y Redis vienen de Testcontainers (@ServiceConnection).
spring:
  flyway:
    locations: classpath:db/migration
  cache:
    type: simple

app:
  security:
    jwt:
      generar-si-falta: true
    rate-limit:
      login-por-minuto: 5
      ip-por-minuto: 10000
  cors:
    allowed-origins: http://localhost:4200
  jobs:
    habilitados: false
