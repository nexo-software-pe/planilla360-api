# Perfil de pruebas: PostgreSQL y Redis vienen de Testcontainers (@ServiceConnection).
spring:
  flyway:
    locations: classpath:db/migration
  cache:
    type: simple

  rabbitmq:
    listener:
      simple:
        retry:
          initial-interval: 50ms
          max-interval: 100ms

app:
  messaging:
    enabled: false
  storage:
    tipo: memoria
  integracion:
    modo: stub
  security:
    jwt:
      generar-si-falta: true
    rate-limit:
      login-por-minuto: 5
      ip-por-minuto: 10000
  cors:
    allowed-origins: http://localhost:4200
  jobs:
    habilitados: false
