<!doctype html>
<html lang="es">
<body style="margin:0;padding:24px;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#12161c">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px">
    <tr>
      <td style="background:#1f3a5f;color:#ffffff;padding:20px 24px;font-size:18px;font-weight:bold;border-radius:8px 8px 0 0">
        {{empresa}}
      </td>
    </tr>
    <tr>
      <td style="padding:24px;font-size:15px;line-height:1.5">
        <p>Hola {{nombre}},</p>
        <p>Tu <strong>{{documento}}</strong> del periodo <strong>{{periodo}}</strong> ya está disponible.</p>
        <p>Puedes descargarla en PDF desde la sección <em>Mis boletas</em> del portal del empleado.</p>
        <p style="color:#5b6472;font-size:13px">Este es un mensaje automático de Planilla360; no respondas a este correo.</p>
      </td>
    </tr>
  </table>
</body>
</html>
