spring:
  application:
    name: planilla360-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  cache:
    # "redis" cuando hay Redis disponible (perfil messaging de compose); "simple" = en memoria.
    type: ${CACHE_TYPE:simple}
    redis:
      time-to-live: 1h
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
    web:
      pageable:
        max-page-size: 100

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: planilla360
      access-ttl: 15m
      refresh-ttl: 7d
      generar-si-falta: false
    rate-limit:
      login-por-minuto: 5
      ip-por-minuto: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
