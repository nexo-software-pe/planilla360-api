spring:
  application:
    name: planilla360-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  cache:
    # "redis" cuando hay Redis disponible (perfil messaging de compose); "simple" = en memoria.
    type: ${CACHE_TYPE:simple}
    redis:
      time-to-live: 1h
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:planilla360}
    password: ${RABBITMQ_PASSWORD:}
    listener:
      simple:
        concurrency: 4
        max-concurrency: 8
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.localhost: planilla360-api  # evita la resolución inversa del nombre del equipo, lenta en algunos Windows
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
    web:
      pageable:
        max-page-size: 100

logging:
  pattern:
    # Con logs de texto (local) cada línea lleva el traceId de la petición; en JSON va como campo propio.
    correlation: "[%X{traceId:-}] "

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # /actuator/prometheus exige HTTP Basic (ver MetricsSecurityConfig y app.metrics).
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # Liveness: el proceso vive (solo su propio estado; nunca depende de la base de datos).
        liveness:
          include: livenessState
        # Readiness: puede recibir tráfico solo si la base de datos responde.
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
    rabbit:
      enabled: ${MESSAGING_ENABLED:false}
    mail:
      enabled: false

app:
  # Primer ADMIN_SAAS de un entorno nuevo (staging/prod). Sin estas variables no se crea ningún usuario.
  bootstrap:
    admin-email: ${ADMIN_INICIAL_EMAIL:}
    admin-password: ${ADMIN_INICIAL_PASSWORD:}
    admin-nombre: ${ADMIN_INICIAL_NOMBRE:}
  # Credencial del raspador de Prometheus para /actuator/prometheus. Sin contraseña (por defecto fuera de local)
  # el endpoint responde siempre 401.
  metrics:
    user: ${METRICS_USER:prometheus}
    password: ${METRICS_PASSWORD:}
  # false = sin RabbitMQ: las boletas y los correos se procesan en el mismo proceso (sin reintentos ni DLQ).
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
  # tipo: s3 (MinIO en local, Cloudflare R2 en la nube) o memoria (sin servicios externos).
  storage:
    tipo: ${STORAGE_TIPO:memoria}
    endpoint: ${STORAGE_ENDPOINT:http://127.0.0.1:9000}
    bucket: ${STORAGE_BUCKET:planilla360-boletas}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    region: ${STORAGE_REGION:us-east-1}
    crear-bucket: ${STORAGE_CREAR_BUCKET:false}
  notificaciones:
    habilitadas: ${NOTIFICACIONES_HABILITADAS:false}
    remitente: ${MAIL_REMITENTE:no-responder@planilla360.ejemplo.pe}
  # modo: stub (respuestas ficticias en el mismo proceso) o http (servicio externo; WireMock en local).
  integracion:
    modo: ${INTEGRACION_MODO:stub}
    base-url: ${INTEGRACION_BASE_URL:http://127.0.0.1:8099}
    timeout: 2s
    reintentos: 3
    espera-reintento: 200ms
    cache-tipo-cambio: 30m
    cortacircuito:
      ventana: 10
      tasa-fallos: 50
      espera-abierto: 30s
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: planilla360
      access-ttl: 15m
      refresh-ttl: 7d
      generar-si-falta: false
    rate-limit:
      login-por-minuto: 5
      ip-por-minuto: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
