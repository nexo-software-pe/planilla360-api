# Infraestructura local de Planilla360. Se levanta por perfiles para usar solo lo necesario:
#   docker compose --profile core up -d        # PostgreSQL
#   docker compose --profile messaging up -d   # PostgreSQL + Redis + RabbitMQ
#   docker compose --profile app up -d --build # PostgreSQL + la API en contenedor
#   docker compose --profile storage up -d     # PostgreSQL + MinIO (archivos) + Mailpit (correo) + WireMock (externos)
#   docker compose --profile full up -d        # todo lo disponible
# Las contraseñas de abajo son solo para desarrollo en tu máquina (puertos expuestos únicamente en
# 127.0.0.1) y se pueden cambiar en .env (ver .env.example).
name: planilla360

services:
  postgres:
    image: postgres:16-alpine
    profiles: [core, messaging, storage, app, full]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planilla360}
      POSTGRES_USER: ${POSTGRES_USER:-planilla360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planilla360}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: [messaging, full]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    profiles: [messaging, full]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-planilla360}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-planilla360}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672" # consola web: http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # MinIO dejó de publicar imágenes en Docker Hub y Quay; imagen mantenida de Chainguard fijada por digest (sin shell).
    image: cgr.dev/chainguard/minio@sha256:a1ac4589a5f8136b616e667b48a0bea9719bb10bd45799ea946f24bbedfafde4
    profiles: [storage, full]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-planilla360}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-planilla360-local}
    ports:
      - "127.0.0.1:9000:9000" # API S3
      - "127.0.0.1:9001:9001" # consola web: http://localhost:9001
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:v1.24
    profiles: [storage, full]
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # bandeja web: http://localhost:8025

  wiremock:
    image: wiremock/wiremock:3.13.2
    profiles: [storage, full]
    command: ["--global-response-templating", "--disable-gzip", "--verbose"]
    ports:
      - "127.0.0.1:${WIREMOCK_PORT:-8099}:8080" # servicios externos simulados (DNI, RUC, tipo de cambio)
    volumes:
      - ./docker/wiremock:/home/wiremock:ro

  api:
    build: .
    profiles: [app]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-planilla360}
      DB_USER: ${POSTGRES_USER:-planilla360}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-planilla360}
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
